services:
  mem-pro:
    build: .
    image: mem-pro:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"      # 由 Caddy/Nginx 终止 TLS 后再暴露 443
    # 全部配置走 .env（检索/精排/时态/caption/并发…）：旧版只透传 8 个变量，
    # RERANK_* / TEMPORAL_* / CAPTION_* 等在容器里静默失效。
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/mem.db        # 固定在持久卷里，忽略 .env 里的本地路径
    volumes:
      - memdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - mem-pro
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-mem.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  memdata:
  caddy_data:
  caddy_config:
