services:
  mem-pro:
    build: .
    image: mem-pro:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"      # 由 Caddy/Nginx 终止 TLS 后再暴露 443
    environment:
      EMBED_MODE: ${EMBED_MODE:-hash}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-v4}
      EMBED_DIM: ${EMBED_DIM:-1024}
      MEMORY_SYSTEM_KEY: ${MEMORY_SYSTEM_KEY:-}
      MAX_INFLIGHT: ${MAX_INFLIGHT:-64}
      MAX_IMAGES: ${MAX_IMAGES:-6}
      LOG_JSON: ${LOG_JSON:-1}
    volumes:
      - memdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - mem-pro
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-mem.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  memdata:
  caddy_data:
  caddy_config:
