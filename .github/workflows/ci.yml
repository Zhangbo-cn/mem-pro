
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + end-to-end tests (numpy path)
        run: pip install "numpy>=2,<3" && python -m unittest discover -s tests -v
      - name: Unit tests (pure stdlib path)
        run: pip uninstall -y numpy && python -m unittest discover -s tests -v
      - name: Mem-Gallery proxy (hash, smoke)
        run: python tools/gallery_proxy.py --limit 2
      - name: Contract + replay + smoke (hash mode)
        run: bash scripts/verify.sh
      - name: Doctor (hash mode, warnings allowed)
        run: python tools/doctor.py --json > doctor.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-${{ matrix.python }}
          path: doctor.json
