# fail2ban filter: repeated auth failures / path probing against mem-pro behind Caddy.
# Reads Caddy's JSON access log (deploy/Caddyfile.ip: /var/log/caddy/access.log, format json).
# mem-pro itself only sees 127.0.0.1 behind the proxy, so the ban decision must use Caddy's log.
#
# Caddy writes request.remote_ip / client_ip before request.headers, and header values are
# JSON-escaped (\"), so a client cannot forge an unescaped "client_ip":"x" via a header.
[Definition]
failregex = ^\{.*?"request":\{.*?"client_ip":"<ADDR>".*"status":(?:401|403)[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
