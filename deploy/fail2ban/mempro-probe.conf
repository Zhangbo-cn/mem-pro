# fail2ban filter: path scanning (wp-login.php, .env, /admin ...) => 404/405 storms.
# The evaluation platform only calls /health, /add and /search, so it never produces these.
[Definition]
failregex = ^\{.*?"request":\{.*?"client_ip":"<ADDR>".*"status":(?:404|405)[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
